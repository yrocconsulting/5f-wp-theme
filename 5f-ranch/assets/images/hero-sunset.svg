<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunset over the ranch pond">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a4a"/>
      <stop offset="0.28" stop-color="#7a4a5a"/>
      <stop offset="0.52" stop-color="#d9714a"/>
      <stop offset="0.68" stop-color="#f4a24f"/>
      <stop offset="0.76" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.72" r="0.42">
      <stop offset="0" stop-color="#fff2c2" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffc768" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f08a4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b462"/>
      <stop offset="0.5" stop-color="#c76a45"/>
      <stop offset="1" stop-color="#4a2c26"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a22"/>
      <stop offset="1" stop-color="#16150e"/>
    </linearGradient>
    <linearGradient id="clouds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6a46a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb980" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6a46a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- streaky clouds -->
  <g fill="url(#clouds)">
    <ellipse cx="420" cy="250" rx="420" ry="14"/>
    <ellipse cx="1080" cy="300" rx="520" ry="10"/>
    <ellipse cx="760" cy="380" rx="600" ry="12"/>
    <ellipse cx="1300" cy="200" rx="300" ry="8"/>
    <ellipse cx="300" cy="430" rx="360" ry="9"/>
  </g>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1090" cy="640" r="34" fill="#fff6d8"/>

  <!-- distant treeline -->
  <path fill="#5a3a3a" opacity="0.75" d="M0 640 C60 620 90 628 140 616 C190 604 230 622 290 610 C350 598 400 614 470 606 C540 598 600 618 680 612 C760 606 820 620 900 614 C980 608 1040 626 1120 618 C1200 610 1260 622 1340 612 C1420 602 1500 618 1600 608 L1600 672 L0 672 Z"/>
  <path fill="#2e2222" d="M0 662 C40 646 70 650 110 640 C150 630 170 648 220 642 C270 636 300 650 360 646 C420 642 470 656 540 650 C610 644 660 660 740 656 C820 652 860 664 940 660 C1020 656 1080 668 1160 662 C1240 656 1300 666 1380 658 C1460 650 1530 662 1600 654 L1600 700 L0 700 Z"/>

  <rect x="0" y="690" width="1600" height="210" fill="#2b2618"/>
  <!-- pond -->
  <path fill="url(#water)" d="M260 700 C420 690 700 688 980 692 C1180 695 1320 700 1400 712 C1330 742 1100 760 860 762 C600 764 380 752 250 734 C210 726 215 704 260 700 Z"/>
  <ellipse cx="1090" cy="712" rx="30" ry="5" fill="#fff1c4" opacity="0.9"/>
  <ellipse cx="1090" cy="728" rx="16" ry="3" fill="#fff1c4" opacity="0.6"/>

  <!-- foreground field -->
  <path fill="url(#field)" d="M0 690 C120 694 200 700 250 712 C230 740 300 760 480 770 C700 782 1000 780 1200 762 C1340 748 1420 724 1460 704 C1520 696 1560 694 1600 694 L1600 900 L0 900 Z"/>

  <!-- live oak, left -->
  <g fill="#14110c">
    <path d="M150 700 C156 640 150 590 132 540 L148 536 C166 584 176 620 178 660 C196 610 230 586 270 572 L276 584 C236 602 204 632 192 700 Z"/>
    <path d="M-40 540 C-20 470 40 430 110 430 C150 380 230 370 290 400 C350 380 420 410 430 460 C470 480 470 540 420 560 C390 590 330 590 290 576 C250 600 180 600 140 580 C90 596 20 590 -10 570 C-40 566 -50 552 -40 540 Z"/>
  </g>

  <!-- windmill, right -->
  <g stroke="#14110c" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M1400 700 L1428 470 L1456 700"/>
    <path d="M1406 650 L1450 650 M1412 600 L1444 600 M1418 550 L1438 550 M1404 690 L1446 608 M1452 690 L1410 608"/>
  </g>
  <g transform="translate(1428 462)" fill="#14110c">
    <circle r="8"/>
    <g stroke="#14110c" stroke-width="4">
      <line x1="0" y1="0" x2="0" y2="-54"/><line x1="0" y1="0" x2="38" y2="-38"/><line x1="0" y1="0" x2="54" y2="0"/>
      <line x1="0" y1="0" x2="38" y2="38"/><line x1="0" y1="0" x2="0" y2="54"/><line x1="0" y1="0" x2="-38" y2="38"/>
      <line x1="0" y1="0" x2="-54" y2="0"/><line x1="0" y1="0" x2="-38" y2="-38"/>
    </g>
    <circle r="52" fill="none" stroke="#14110c" stroke-width="3"/>
    <path d="M8 -4 L70 -14 L84 -2 L70 10 L8 4 Z"/>
  </g>

  <!-- sunflowers along the bottom edge -->
  <g fill="#14110c">
    <g transform="translate(330 820)"><rect x="-3" y="0" width="6" height="90"/><circle r="22"/><path d="M-6 30 C-40 20 -50 40 -60 50 C-30 52 -14 44 -6 36 Z"/></g>
    <g transform="translate(420 850) scale(0.8)"><rect x="-3" y="0" width="6" height="90"/><circle r="22"/><path d="M6 28 C40 18 50 38 60 48 C30 50 14 42 6 34 Z"/></g>
    <g transform="translate(1180 830) scale(0.9)"><rect x="-3" y="0" width="6" height="90"/><circle r="22"/><path d="M-6 30 C-40 20 -50 40 -60 50 C-30 52 -14 44 -6 36 Z"/></g>
    <g transform="translate(1270 860) scale(0.7)"><rect x="-3" y="0" width="6" height="90"/><circle r="22"/></g>
  </g>
  <g fill="#c98a1e" opacity="0.9">
    <circle cx="330" cy="820" r="12"/><circle cx="420" cy="850" r="10"/><circle cx="1180" cy="830" r="11"/><circle cx="1270" cy="860" r="8"/>
  </g>

  <!-- doves in flight -->
  <g fill="#1d1712">
    <path d="M520 250 c14 -12 30 -14 40 -6 c8 -10 22 -14 36 -10 c-14 4 -26 12 -32 22 c-6 -6 -24 -8 -44 -6 Z"/>
    <path d="M640 200 c10 -9 22 -10 30 -4 c6 -8 16 -10 26 -8 c-10 3 -19 9 -24 16 c-5 -4 -18 -6 -32 -4 Z"/>
    <path d="M980 230 c12 -10 26 -12 35 -5 c7 -9 19 -12 31 -9 c-12 4 -23 10 -28 19 c-5 -5 -21 -7 -38 -5 Z"/>
    <path d="M1160 180 c9 -8 20 -9 27 -4 c5 -7 14 -9 23 -7 c-9 3 -17 8 -21 14 c-4 -4 -16 -5 -29 -3 Z"/>
  </g>
</svg>
